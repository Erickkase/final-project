name: Frontend CI/CD

on:
  pull_request:
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/frontend-ci-cd.yml'
    branches:
      - dev
      - qa
      - main
  push:
    paths:
      - 'apps/frontend/**'
    branches:
      - dev
      - qa
      - main

jobs:
  lint:
    name: Lint Frontend Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_API_BASE_URL: http://test-alb.example.com

      - name: Check build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed - dist directory not found"
            exit 1
          fi
          echo "✅ Build successful"
          ls -lh dist/

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

  test-summary:
    name: Frontend Test Summary
    runs-on: ubuntu-latest
    needs:
      - lint
      - build
      - type-check
    if: always()
    steps:
      - name: Print Summary
        run: |
          echo "## 📊 Frontend CI Summary"
          echo ""
          echo "| Job | Status |"
          echo "|-----|--------|"
          echo "| Lint | ${{ needs.lint.result }} |"
          echo "| Build | ${{ needs.build.result }} |"
          echo "| Type Check | ${{ needs.type-check.result }} |"
          echo ""

      - name: Check for failures
        if: |
          needs.lint.result == 'failure' ||
          needs.build.result == 'failure' ||
          needs.type-check.result == 'failure'
        run: |
          echo "❌ Some frontend checks failed"
          exit 1

      - name: Success message
        if: |
          needs.lint.result == 'success' &&
          needs.build.result == 'success' &&
          needs.type-check.result == 'success'
        run: |
          echo "✅ All frontend checks passed!"

  create-pull-request:
    name: Create Pull Request to QA
    runs-on: ubuntu-latest
    needs: test-summary
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      needs.test-summary.result == 'success'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: dev
          base: qa
          title: '🚀 Frontend: Deploy to QA'
          body: |
            ## 🎨 Frontend Deployment to QA
            
            ### ✅ All CI Checks Passed
            - ✅ Lint passed
            - ✅ Build successful
            - ✅ TypeScript type check passed
            
            ### 📦 Changes
            This PR contains frontend changes that have passed all quality checks and are ready for QA deployment.
            
            ### 🚀 What happens after merge?
            - Docker image will be built with tag `v1.${{ github.run_number }}`
            - Image will be pushed to Docker Hub
            - Terraform will deploy to AWS QA environment
            - ASG instances will be refreshed for zero-downtime deployment
            
            ### 🔗 Related Workflow
            - **CI Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            ---
            *Auto-generated PR after successful CI checks*
          labels: |
            frontend
            qa
            auto-deploy
          draft: false

      - name: PR Created
        run: |
          echo "✅ Pull Request created successfully!"
          echo "🔗 PR will trigger Docker build and AWS deployment when merged to qa"
