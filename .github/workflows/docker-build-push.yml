name: Docker Build and Push to Hub

on:
  workflow_run:
    workflows: ["CI/CD - Dev to QA"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to build (comma-separated: api-gateway,auth-service,emotion-service)'
        required: false
        default: 'api-gateway,auth-service,emotion-service'

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'qa'
      )
    outputs:
      api-gateway: ${{ steps.changes.outputs.api-gateway }}
      auth-service: ${{ steps.changes.outputs.auth-service }}
      emotion-service: ${{ steps.changes.outputs.emotion-service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Detect changed services
        id: changes
        run: |
          # Get the list of changed files from the last commit in qa
          CHANGED_FILES=$(git diff --name-only HEAD~1..HEAD 2>/dev/null || echo "services/")
          
          echo "Changed files in last merge: $CHANGED_FILES"
          
          # Check which services changed
          echo "api-gateway=$(echo "$CHANGED_FILES" | grep -q '^services/api-gateway/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "auth-service=$(echo "$CHANGED_FILES" | grep -q '^services/auth-service/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "emotion-service=$(echo "$CHANGED_FILES" | grep -q '^services/emotion-service/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

  # Build and Push API Gateway
  build-api-gateway:
    name: Build & Push API Gateway
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api-gateway == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./services/api-gateway
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-api-gateway:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-api-gateway:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-api-gateway:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-api-gateway:buildcache,mode=max

  # Build and Push Auth Service
  build-auth-service:
    name: Build & Push Auth Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.auth-service == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/auth-service
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-auth-service:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-auth-service:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-auth-service:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-auth-service:buildcache,mode=max

  # Build and Push Emotion Service
  build-emotion-service:
    name: Build & Push Emotion Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.emotion-service == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Emotion Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/emotion-service
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-emotion-service:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-emotion-service:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-emotion-service:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-emotion-service:buildcache,mode=max

  # Build Summary
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - build-api-gateway
      - build-auth-service
      - build-emotion-service
    if: always()
    steps:
      - name: Print Summary
        run: |
          echo "## 🐳 Docker Build & Push Summary"
          echo ""
          echo "| Service | Status |"
          echo "|---------|--------|"
          echo "| API Gateway | ${{ needs.build-api-gateway.result }} |"
          echo "| Auth Service | ${{ needs.build-auth-service.result }} |"
          echo "| Emotion Service | ${{ needs.build-emotion-service.result }} |"
          echo ""
          echo "✅ Images pushed to Docker Hub"
          echo "📝 Tags: latest, ${{ github.sha }}"

      - name: Image Details
        run: |
          echo "## 📦 Docker Hub Images"
          echo ""
          echo "API Gateway:"
          echo "  - ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-api-gateway:latest"
          echo "  - ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-api-gateway:${{ github.sha }}"
          echo ""
          echo "Auth Service:"
          echo "  - ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-auth-service:latest"
          echo "  - ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-auth-service:${{ github.sha }}"
          echo ""
          echo "Emotion Service:"
          echo "  - ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-emotion-service:latest"
          echo "  - ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-emotion-service:${{ github.sha }}"

      - name: Check for failures
        if: |
          needs.build-api-gateway.result == 'failure' ||
          needs.build-auth-service.result == 'failure' ||
          needs.build-emotion-service.result == 'failure'
        run: |
          echo "❌ Some builds failed. Please review the logs."
