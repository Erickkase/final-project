name: Docker Build and Push to Hub

on:
  pull_request:
    types:
      - closed
    branches:
      - qa
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to build (comma-separated: api-gateway,auth-service,emotion-service)'
        required: false
        default: 'api-gateway,auth-service,emotion-service'

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    outputs:
      api-gateway: ${{ steps.changes.outputs.api-gateway }}
      auth-service: ${{ steps.changes.outputs.auth-service }}
      emotion-service: ${{ steps.changes.outputs.emotion-service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: qa
          fetch-depth: 0

      - name: Detect changed services
        id: changes
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "🐳 Manual trigger - Building all service images"
            echo "api-gateway=true" >> $GITHUB_OUTPUT
            echo "auth-service=true" >> $GITHUB_OUTPUT
            echo "emotion-service=true" >> $GITHUB_OUTPUT
          else
            # Get changed files from the merged PR
            echo "🔍 Detecting changed services in PR..."
            
            # Get the merge commit's diff
            CHANGED_FILES=$(git diff --name-only HEAD~1..HEAD)
            echo "Changed files:"
            echo "$CHANGED_FILES"
            
            # Check which services changed
            if echo "$CHANGED_FILES" | grep -q '^services/api-gateway/'; then
              echo "api-gateway=true" >> $GITHUB_OUTPUT
              echo "✅ API Gateway changed"
            else
              echo "api-gateway=false" >> $GITHUB_OUTPUT
              echo "⏭️ API Gateway unchanged"
            fi
            
            if echo "$CHANGED_FILES" | grep -q '^services/auth-service/'; then
              echo "auth-service=true" >> $GITHUB_OUTPUT
              echo "✅ Auth Service changed"
            else
              echo "auth-service=false" >> $GITHUB_OUTPUT
              echo "⏭️ Auth Service unchanged"
            fi
            
            if echo "$CHANGED_FILES" | grep -q '^services/emotion-service/'; then
              echo "emotion-service=true" >> $GITHUB_OUTPUT
              echo "✅ Emotion Service changed"
            else
              echo "emotion-service=false" >> $GITHUB_OUTPUT
              echo "⏭️ Emotion Service unchanged"
            fi
          fi

  # Build and Push API Gateway
  build-api-gateway:
    name: Build & Push API Gateway
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api-gateway == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./services/api-gateway
          file: ./services/api-gateway/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-api-gateway:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-api-gateway:v1.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  # Build and Push Auth Service
  build-auth-service:
    name: Build & Push Auth Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.auth-service == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/auth-service
          file: ./services/auth-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-auth-service:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-auth-service:v1.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  # Build and Push Emotion Service
  build-emotion-service:
    name: Build & Push Emotion Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.emotion-service == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Emotion Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/emotion-service
          file: ./services/emotion-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-emotion-service:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-emotion-service:v1.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  # Build Summary
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - build-api-gateway
      - build-auth-service
      - build-emotion-service
    if: always()
    steps:
      - name: Print Summary
        run: |
          echo "## 🐳 Docker Build & Push Summary"
          echo ""
          echo "| Service | Status |"
          echo "|---------|--------|"
          echo "| API Gateway | ${{ needs.build-api-gateway.result }} |"
          echo "| Auth Service | ${{ needs.build-auth-service.result }} |"
          echo "| Emotion Service | ${{ needs.build-emotion-service.result }} |"
          echo ""
          echo "✅ Images pushed to Docker Hub"
          echo "📝 Tags: latest, ${{ github.sha }}"

      - name: Image Details
        run: |
          echo "## 📦 Docker Hub Images"
          echo ""
          echo "API Gateway:"
          echo "  - ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-api-gateway:latest"
          echo "  - ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-api-gateway:${{ github.sha }}"
          echo ""
          echo "Auth Service:"
          echo "  - ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-auth-service:latest"
          echo "  - ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-auth-service:${{ github.sha }}"
          echo ""
          echo "Emotion Service:"
          echo "  - ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-emotion-service:latest"
          echo "  - ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-emotion-service:${{ github.sha }}"

      - name: Check for failures
        if: |
          needs.build-api-gateway.result == 'failure' ||
          needs.build-auth-service.result == 'failure' ||
          needs.build-emotion-service.result == 'failure'
        run: |
          echo "❌ Some builds failed. Please review the logs."
