name: Docker Build and Push to Hub

on:
  pull_request:
    types:
      - closed
    branches:
      - qa
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to build (comma-separated or all)'
        required: false
        default: 'all'

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    outputs:
      api-gateway: ${{ steps.changes.outputs.api-gateway }}
      auth-service: ${{ steps.changes.outputs.auth-service }}
      emotion-service: ${{ steps.changes.outputs.emotion-service }}
      report-service: ${{ steps.changes.outputs.report-service }}
      notification-service: ${{ steps.changes.outputs.notification-service }}
      user-service: ${{ steps.changes.outputs.user-service }}
      analytics-service: ${{ steps.changes.outputs.analytics-service }}
      goal-service: ${{ steps.changes.outputs.goal-service }}
      journal-service: ${{ steps.changes.outputs.journal-service }}
      recommendation-service: ${{ steps.changes.outputs.recommendation-service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: qa
          fetch-depth: 0

      - name: Detect changed services
        id: changes
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "🐳 Manual trigger - Building all service images"
            echo "api-gateway=true" >> $GITHUB_OUTPUT
            echo "auth-service=true" >> $GITHUB_OUTPUT
            echo "emotion-service=true" >> $GITHUB_OUTPUT
            echo "report-service=true" >> $GITHUB_OUTPUT
            echo "notification-service=true" >> $GITHUB_OUTPUT
            echo "user-service=true" >> $GITHUB_OUTPUT
            echo "analytics-service=true" >> $GITHUB_OUTPUT
            echo "goal-service=true" >> $GITHUB_OUTPUT
            echo "journal-service=true" >> $GITHUB_OUTPUT
            echo "recommendation-service=true" >> $GITHUB_OUTPUT
          else
            # Get changed files from the merged PR
            echo "🔍 Detecting changed services in PR..."
            
            # Get the merge commit's diff
            CHANGED_FILES=$(git diff --name-only HEAD~1..HEAD)
            echo "Changed files:"
            echo "$CHANGED_FILES"
            
            # Check which services changed
            for service in api-gateway auth-service emotion-service report-service notification-service user-service analytics-service goal-service journal-service recommendation-service; do
              if echo "$CHANGED_FILES" | grep -q "^services/$service/"; then
                echo "$service=true" >> $GITHUB_OUTPUT
                echo "✅ $service changed"
              else
                echo "$service=false" >> $GITHUB_OUTPUT
                echo "⏭️ $service unchanged"
              fi
            done
          fi

  # Build and Push Auth Service
  build-auth-service:
    name: Build & Push Auth Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.auth-service == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/auth-service
          file: ./services/auth-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-auth-service:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-auth-service:v1.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  # Build and Push Emotion Service
  build-emotion-service:
    name: Build & Push Emotion Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.emotion-service == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Emotion Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/emotion-service
          file: ./services/emotion-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-emotion-service:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-emotion-service:v1.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  # Build and Push Report Service
  build-report-service:
    name: Build & Push Report Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.report-service == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Report Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/report-service
          file: ./services/report-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-report-service:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-report-service:v1.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  # Build and Push API Gateway
  build-api-gateway:
    name: Build & Push API Gateway
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api-gateway == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./services/api-gateway
          file: ./services/api-gateway/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-api-gateway:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-api-gateway:v1.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  # Build and Push Notification Service
  build-notification-service:
    name: Build & Push Notification Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.notification-service == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Notification Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/notification-service
          file: ./services/notification-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-notification-service:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-notification-service:v1.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  # Build and Push User Service
  build-user-service:
    name: Build & Push User Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.user-service == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push User Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/user-service
          file: ./services/user-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-user-service:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-user-service:v1.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  # Build and Push Analytics Service
  build-analytics-service:
    name: Build & Push Analytics Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.analytics-service == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Analytics Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/analytics-service
          file: ./services/analytics-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-analytics-service:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-analytics-service:v1.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  # Build and Push Goal Service
  build-goal-service:
    name: Build & Push Goal Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.goal-service == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Goal Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/goal-service
          file: ./services/goal-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-goal-service:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-goal-service:v1.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  # Build and Push Journal Service
  build-journal-service:
    name: Build & Push Journal Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.journal-service == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Journal Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/journal-service
          file: ./services/journal-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-journal-service:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-journal-service:v1.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  # Build and Push Recommendation Service
  build-recommendation-service:
    name: Build & Push Recommendation Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.recommendation-service == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Recommendation Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/recommendation-service
          file: ./services/recommendation-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-recommendation-service:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-recommendation-service:v1.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  # Build Summary
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - build-api-gateway
      - build-auth-service
      - build-emotion-service
      - build-report-service
      - build-notification-service
      - build-user-service
      - build-analytics-service
      - build-goal-service
      - build-journal-service
      - build-recommendation-service
    if: always()
    steps:
      - name: Print Summary
        run: |
          echo "## 🐳 Docker Build & Push Summary"
          echo ""
          echo "| Service | Status |"
          echo "|---------|--------|"
          echo "| API Gateway | ${{ needs.build-api-gateway.result }} |"
          echo "| Auth Service | ${{ needs.build-auth-service.result }} |"
          echo "| Emotion Service | ${{ needs.build-emotion-service.result }} |"
          echo "| Report Service | ${{ needs.build-report-service.result }} |"
          echo "| Notification Service | ${{ needs.build-notification-service.result }} |"
          echo "| User Service | ${{ needs.build-user-service.result }} |"
          echo "| Analytics Service | ${{ needs.build-analytics-service.result }} |"
          echo "| Goal Service | ${{ needs.build-goal-service.result }} |"
          echo "| Journal Service | ${{ needs.build-journal-service.result }} |"
          echo "| Recommendation Service | ${{ needs.build-recommendation-service.result }} |"
          echo ""
          echo "✅ Images pushed to Docker Hub"
          echo "📝 Tags: latest, v1.${{ github.run_number }}"

      - name: Image Details
        run: |
          echo "## 📦 Docker Hub Images"
          echo ""
          echo "All images are available at:"
          echo "- ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-api-gateway"
          echo "- ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-auth-service"
          echo "- ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-emotion-service"
          echo "- ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-report-service"
          echo "- ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-notification-service"
          echo "- ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-user-service"
          echo "- ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-analytics-service"
          echo "- ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-goal-service"
          echo "- ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-journal-service"
          echo "- ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-recommendation-service"
          echo ""
          echo "Auth Service:"
          echo "  - ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-auth-service:latest"
          echo "  - ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-auth-service:v1.${{ github.run_number }}"
          echo ""
          echo "Emotion Service:"
          echo "  - ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-emotion-service:latest"
          echo "  - ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-emotion-service:v1.${{ github.run_number }}"
          echo ""
          echo "Report Service:"
          echo "  - ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-report-service:latest"
          echo "  - ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-report-service:v1.${{ github.run_number }}"

      - name: Check for failures
        if: |
          needs.build-auth-service.result == 'failure' ||
          needs.build-emotion-service.result == 'failure' ||
          needs.build-report-service.result == 'failure'
        run: |
          echo "❌ Some builds failed. Please review the logs."

  # Deploy to AWS with Terraform (solo en QA y Main)
  terraform-deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [build-summary, detect-changes, build-auth-service, build-emotion-service, build-report-service]
    if: |
      always() &&
      (github.ref == 'refs/heads/qa' || github.ref == 'refs/heads/main') &&
      (
        needs.build-auth-service.result == 'success' ||
        needs.build-emotion-service.result == 'success' ||
        needs.build-report-service.result == 'success'
      )
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: ./infra
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            BRANCH="main"
          else
            BRANCH="qa"
          fi
          
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "image_tag=latest" >> $GITHUB_OUTPUT
          echo "🚀 Deploying to $BRANCH with tag latest"

      - name: Initialize Terraform
        run: terraform init -migrate-state

      - name: Validate Terraform
        run: terraform validate

      - name: Format Terraform
        run: terraform fmt -recursive

      - name: Plan Terraform
        run: |
          terraform plan \
            -var="AWS_REGION=${{ secrets.AWS_REGION }}" \
            -var="AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" \
            -var="AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            -var="AWS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }}" \
            -var="BRANCH_NAME=${{ steps.env.outputs.branch }}" \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
            -var="docker_hub_username=${{ secrets.DOCKER_HUB_USERNAME }}" \
            -var="image_tag=latest" \
            -var="vpc_id=${{ secrets.VPC_ID }}" \
            -var="subnet1=${{ secrets.SUBNET1 }}" \
            -var="subnet2=${{ secrets.SUBNET2 }}"
      
      - name: Apply Terraform
        id: apply-tf
        run: |
          terraform apply -auto-approve \
            -var="AWS_REGION=${{ secrets.AWS_REGION }}" \
            -var="AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" \
            -var="AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            -var="AWS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }}" \
            -var="BRANCH_NAME=${{ steps.env.outputs.branch }}" \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
            -var="docker_hub_username=${{ secrets.DOCKER_HUB_USERNAME }}" \
            -var="image_tag=latest" \
            -var="vpc_id=${{ secrets.VPC_ID }}" \
            -var="subnet1=${{ secrets.SUBNET1 }}" \
            -var="subnet2=${{ secrets.SUBNET2 }}"

      - name: Show Terraform Outputs
        run: |
          echo "✅ Terraform deployment successful!"
          echo ""
          echo "📊 Infrastructure Outputs:"
          terraform output

  # Refresh ASG instances if needed
  refresh-asg:
    name: Refresh ASG
    runs-on: ubuntu-latest
    needs: terraform-deploy
    if: success()
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refresh ASG instances one by one
        run: |
          echo "🔄 Refreshing Auto Scaling Group instances..."
          
          for ASG_NAME in $(aws autoscaling describe-auto-scaling-groups --region $AWS_REGION --query "AutoScalingGroups[?contains(AutoScalingGroupName, 'emotrack')].AutoScalingGroupName" --output text); do
            echo "📦 Processing ASG: $ASG_NAME"
            
            INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
              --region $AWS_REGION \
              --auto-scaling-group-names $ASG_NAME \
              --query "AutoScalingGroups[0].Instances[].InstanceId" \
              --output text)
            
            for id in $INSTANCE_IDS; do
              echo "🔄 Terminating and refreshing instance $id..."
              aws ec2 create-tags --region $AWS_REGION --resources $id --tags Key=Name,Value=$ASG_NAME-instance
              aws autoscaling terminate-instance-in-auto-scaling-group \
                --region $AWS_REGION \
                --instance-id $id \
                --no-should-decrement-desired-capacity
              
              echo "⏳ Waiting for new instance to be InService..."
              while true; do
                HEALTHY_COUNT=$(aws autoscaling describe-auto-scaling-groups \
                  --region $AWS_REGION \
                  --auto-scaling-group-names $ASG_NAME \
                  --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'] | length(@)" \
                  --output text)
                
                if [ "$HEALTHY_COUNT" -ge 2 ]; then
                  echo "✅ New instance is InService. Continuing..."
                  break
                fi
                echo "   Still waiting... ($HEALTHY_COUNT/2 healthy)"
                sleep 15
              done
            done
            echo "✅ ASG $ASG_NAME refreshed successfully"
          done
          
          echo "🎉 All ASG instances refreshed!"

      - name: Deployment Complete
        run: |
          echo "✅ Deployment completed successfully!"
          echo "🚀 Your microservices are now running on AWS"
