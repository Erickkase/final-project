name: CI/CD - Dev to QA

on:
  push:
    branches:
      - dev
    paths:
      - 'services/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - dev
    paths:
      - 'services/**'

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      api-gateway: ${{ steps.changes.outputs.api-gateway }}
      auth-service: ${{ steps.changes.outputs.auth-service }}
      emotion-service: ${{ steps.changes.outputs.emotion-service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: changes
        run: |
          # Get the list of changed files
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          fi
          
          echo "Changed files: $CHANGED_FILES"
          
          # Check which services changed
          echo "api-gateway=$(echo "$CHANGED_FILES" | grep -q '^services/api-gateway/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "auth-service=$(echo "$CHANGED_FILES" | grep -q '^services/auth-service/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "emotion-service=$(echo "$CHANGED_FILES" | grep -q '^services/emotion-service/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

  # Test API Gateway
  test-api-gateway:
    name: Test API Gateway
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api-gateway == 'true' || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'services/api-gateway/package-lock.json'

      - name: Install dependencies
        working-directory: services/api-gateway
        run: npm ci

      - name: Run linter
        working-directory: services/api-gateway
        run: npm run lint --if-present || true

      - name: Run tests
        working-directory: services/api-gateway
        run: npm test -- --coverage --passWithNoTests

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./services/api-gateway/coverage/coverage-final.json
          flags: api-gateway
          fail_ci_if_error: false

  # Test Auth Service
  test-auth-service:
    name: Test Auth Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.auth-service == 'true' || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'services/auth-service/package-lock.json'

      - name: Install dependencies
        working-directory: services/auth-service
        run: npm ci

      - name: Run linter
        working-directory: services/auth-service
        run: npm run lint --if-present || true

      - name: Run tests
        working-directory: services/auth-service
        run: npm test -- --coverage --passWithNoTests

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./services/auth-service/coverage/coverage-final.json
          flags: auth-service
          fail_ci_if_error: false

  # Test Emotion Service
  test-emotion-service:
    name: Test Emotion Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.emotion-service == 'true' || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'services/emotion-service/package-lock.json'

      - name: Install dependencies
        working-directory: services/emotion-service
        run: npm ci

      - name: Run linter
        working-directory: services/emotion-service
        run: npm run lint --if-present || true

      - name: Run tests
        working-directory: services/emotion-service
        run: npm test -- --coverage --passWithNoTests

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./services/emotion-service/coverage/coverage-final.json
          flags: emotion-service
          fail_ci_if_error: false

  # Merge to QA branch if tests pass
  merge-to-qa:
    name: Merge to QA Branch
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - test-api-gateway
      - test-auth-service
      - test-emotion-service
    if: |
      github.event_name == 'push' && 
      github.ref == 'refs/heads/dev' &&
      always() &&
      (needs.test-api-gateway.result == 'success' || needs.test-api-gateway.result == 'skipped') &&
      (needs.test-auth-service.result == 'success' || needs.test-auth-service.result == 'skipped') &&
      (needs.test-emotion-service.result == 'success' || needs.test-emotion-service.result == 'skipped')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --local user.email "ehbonilla@uce.edu.ec"
          git config --local user.name "Erickkase"

      - name: Merge to QA
        run: |
          git fetch origin qa || git branch qa origin/dev
          git checkout qa
          git merge dev --no-ff -m "Merge dev to qa after successful tests [CI/CD]"
          git push origin qa

      - name: Create Pull Request Notification
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ All tests passed! Code merged to QA branch.'
            })

  # Summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs:
      - test-api-gateway
      - test-auth-service
      - test-emotion-service
    if: always()
    steps:
      - name: Print Summary
        run: |
          echo "## 📊 Test Results Summary"
          echo ""
          echo "| Service | Status |"
          echo "|---------|--------|"
          echo "| API Gateway | ${{ needs.test-api-gateway.result }} |"
          echo "| Auth Service | ${{ needs.test-auth-service.result }} |"
          echo "| Emotion Service | ${{ needs.test-emotion-service.result }} |"

      - name: Check for failures
        if: |
          needs.test-api-gateway.result == 'failure' ||
          needs.test-auth-service.result == 'failure' ||
          needs.test-emotion-service.result == 'failure'
        run: |
          echo "❌ Some tests failed. Please review the logs."
          exit 1
