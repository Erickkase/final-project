name: CI/CD - Dev to QA

on:
  push:
    branches:
      - dev
    paths:
      - 'services/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - dev
    paths:
      - 'services/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      auth-service: ${{ steps.changes.outputs.auth-service }}
      emotion-service: ${{ steps.changes.outputs.emotion-service }}
      report-service: ${{ steps.changes.outputs.report-service }}
      notification-service: ${{ steps.changes.outputs.notification-service }}
      user-service: ${{ steps.changes.outputs.user-service }}
      analytics-service: ${{ steps.changes.outputs.analytics-service }}
      goal-service: ${{ steps.changes.outputs.goal-service }}
      journal-service: ${{ steps.changes.outputs.journal-service }}
      recommendation-service: ${{ steps.changes.outputs.recommendation-service }}
      api-gateway: ${{ steps.changes.outputs.api-gateway }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: changes
        run: |
          # Get the list of changed files
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          fi
          
          echo "Changed files: $CHANGED_FILES"
          
          # Check which services changed
          echo "auth-service=$(echo "$CHANGED_FILES" | grep -q '^services/auth-service/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "emotion-service=$(echo "$CHANGED_FILES" | grep -q '^services/emotion-service/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "report-service=$(echo "$CHANGED_FILES" | grep -q '^services/report-service/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "notification-service=$(echo "$CHANGED_FILES" | grep -q '^services/notification-service/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "user-service=$(echo "$CHANGED_FILES" | grep -q '^services/user-service/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "analytics-service=$(echo "$CHANGED_FILES" | grep -q '^services/analytics-service/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "goal-service=$(echo "$CHANGED_FILES" | grep -q '^services/goal-service/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "journal-service=$(echo "$CHANGED_FILES" | grep -q '^services/journal-service/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "recommendation-service=$(echo "$CHANGED_FILES" | grep -q '^services/recommendation-service/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "api-gateway=$(echo "$CHANGED_FILES" | grep -q '^services/api-gateway/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

  # Test Auth Service
  test-auth-service:
    name: Test Auth Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.auth-service == 'true' || github.event_name == 'pull_request'
    outputs:
      status: ${{ job.status }}
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'services/auth-service/package-lock.json'

      - name: Install dependencies
        working-directory: services/auth-service
        run: npm ci

      - name: Run linter
        working-directory: services/auth-service
        run: npm run lint --if-present || true

      - name: Run tests
        working-directory: services/auth-service
        run: npm test -- --coverage --passWithNoTests

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./services/auth-service/coverage/coverage-final.json
          flags: auth-service
          fail_ci_if_error: false

  # Test Emotion Service
  test-emotion-service:
    name: Test Emotion Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.emotion-service == 'true' || github.event_name == 'pull_request'
    outputs:
      status: ${{ job.status }}
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'services/emotion-service/package-lock.json'

      - name: Install dependencies
        working-directory: services/emotion-service
        run: npm ci

      - name: Run linter
        working-directory: services/emotion-service
        run: npm run lint --if-present || true

      - name: Run tests
        working-directory: services/emotion-service
        run: npm test -- --coverage --passWithNoTests

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./services/emotion-service/coverage/coverage-final.json
          flags: emotion-service
          fail_ci_if_error: false

  # Test Report Service
  test-report-service:
    name: Test Report Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.report-service == 'true' || github.event_name == 'pull_request'
    outputs:
      status: ${{ job.status }}
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'services/report-service/package-lock.json'

      - name: Install dependencies
        working-directory: services/report-service
        run: npm ci

      - name: Run linter
        working-directory: services/report-service
        run: npm run lint --if-present || true

      - name: Run tests
        working-directory: services/report-service
        run: npm test -- --coverage --passWithNoTests

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./services/report-service/coverage/coverage-final.json
          flags: report-service
          fail_ci_if_error: false

  # Test Notification Service
  test-notification-service:
    name: Test Notification Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.notification-service == 'true' || github.event_name == 'pull_request'
    outputs:
      status: ${{ job.status }}
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'services/notification-service/package-lock.json'

      - name: Install dependencies
        working-directory: services/notification-service
        run: npm ci

      - name: Run linter
        working-directory: services/notification-service
        run: npm run lint --if-present || true

      - name: Run tests
        working-directory: services/notification-service
        run: npm test -- --coverage --passWithNoTests

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./services/notification-service/coverage/coverage-final.json
          flags: notification-service
          fail_ci_if_error: false

  # Test User Service
  test-user-service:
    name: Test User Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.user-service == 'true' || github.event_name == 'pull_request'
    outputs:
      status: ${{ job.status }}
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'services/user-service/package-lock.json'

      - name: Install dependencies
        working-directory: services/user-service
        run: npm ci

      - name: Run linter
        working-directory: services/user-service
        run: npm run lint --if-present || true

      - name: Run tests
        working-directory: services/user-service
        run: npm test -- --coverage --passWithNoTests

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./services/user-service/coverage/coverage-final.json
          flags: user-service
          fail_ci_if_error: false

  # Test Analytics Service
  test-analytics-service:
    name: Test Analytics Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.analytics-service == 'true' || github.event_name == 'pull_request'
    outputs:
      status: ${{ job.status }}
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'services/analytics-service/package-lock.json'

      - name: Install dependencies
        working-directory: services/analytics-service
        run: npm ci

      - name: Run linter
        working-directory: services/analytics-service
        run: npm run lint --if-present || true

      - name: Run tests
        working-directory: services/analytics-service
        run: npm test -- --coverage --passWithNoTests

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./services/analytics-service/coverage/coverage-final.json
          flags: analytics-service
          fail_ci_if_error: false

  # Test Goal Service
  test-goal-service:
    name: Test Goal Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.goal-service == 'true' || github.event_name == 'pull_request'
    outputs:
      status: ${{ job.status }}
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'services/goal-service/package-lock.json'

      - name: Install dependencies
        working-directory: services/goal-service
        run: npm ci

      - name: Run linter
        working-directory: services/goal-service
        run: npm run lint --if-present || true

      - name: Run tests
        working-directory: services/goal-service
        run: npm test -- --coverage --passWithNoTests

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./services/goal-service/coverage/coverage-final.json
          flags: goal-service
          fail_ci_if_error: false

  # Test Journal Service
  test-journal-service:
    name: Test Journal Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.journal-service == 'true' || github.event_name == 'pull_request'
    outputs:
      status: ${{ job.status }}
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'services/journal-service/package-lock.json'

      - name: Install dependencies
        working-directory: services/journal-service
        run: npm ci

      - name: Run linter
        working-directory: services/journal-service
        run: npm run lint --if-present || true

      - name: Run tests
        working-directory: services/journal-service
        run: npm test -- --coverage --passWithNoTests

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./services/journal-service/coverage/coverage-final.json
          flags: journal-service
          fail_ci_if_error: false

  # Test Recommendation Service
  test-recommendation-service:
    name: Test Recommendation Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.recommendation-service == 'true' || github.event_name == 'pull_request'
    outputs:
      status: ${{ job.status }}
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'services/recommendation-service/package-lock.json'

      - name: Install dependencies
        working-directory: services/recommendation-service
        run: npm ci

      - name: Run linter
        working-directory: services/recommendation-service
        run: npm run lint --if-present || true

      - name: Run tests
        working-directory: services/recommendation-service
        run: npm test -- --coverage --passWithNoTests

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./services/recommendation-service/coverage/coverage-final.json
          flags: recommendation-service
          fail_ci_if_error: false

  # Test API Gateway
  test-api-gateway:
    name: Test API Gateway
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api-gateway == 'true' || github.event_name == 'pull_request'
    outputs:
      status: ${{ job.status }}
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'services/api-gateway/package-lock.json'

      - name: Install dependencies
        working-directory: services/api-gateway
        run: npm ci

      - name: Run linter
        working-directory: services/api-gateway
        run: npm run lint --if-present || true

      - name: Run tests
        working-directory: services/api-gateway
        run: npm test -- --coverage --passWithNoTests

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./services/api-gateway/coverage/coverage-final.json
          flags: api-gateway
          fail_ci_if_error: false

  # Create Pull Request to QA branch for passing services
  create-pr-to-qa:
    name: Create PR to QA
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - test-auth-service
      - test-emotion-service
      - test-report-service
      - test-notification-service
      - test-user-service
      - test-analytics-service
      - test-goal-service
      - test-journal-service
      - test-recommendation-service
      - test-api-gateway
    if: |
      always() &&
      github.event_name == 'push' && 
      github.ref == 'refs/heads/dev' &&
      (needs.test-auth-service.result == 'success' || 
       needs.test-emotion-service.result == 'success' || 
       needs.test-report-service.result == 'success' ||
       needs.test-notification-service.result == 'success' ||
       needs.test-user-service.result == 'success' ||
       needs.test-analytics-service.result == 'success' ||
       needs.test-goal-service.result == 'success' ||
       needs.test-journal-service.result == 'success' ||
       needs.test-recommendation-service.result == 'success' ||
       needs.test-api-gateway.result == 'success')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build PR Summary
        id: pr-summary
        run: |
          echo "## 📊 Test Results" > pr_body.txt
          echo "" >> pr_body.txt
          echo "| Service | Status |" >> pr_body.txt
          echo "|---------|--------|" >> pr_body.txt
          
          PASSING_SERVICES=""
          
          if [ "${{ needs.test-auth-service.result }}" == "success" ]; then
            echo "| Auth Service | ✅ Tests Passed |" >> pr_body.txt
            PASSING_SERVICES="$PASSING_SERVICES- Auth Service\n"
          else
            echo "| Auth Service | ❌ ${{ needs.test-auth-service.result }} |" >> pr_body.txt
          fi
          
          if [ "${{ needs.test-emotion-service.result }}" == "success" ]; then
            echo "| Emotion Service | ✅ Tests Passed |" >> pr_body.txt
            PASSING_SERVICES="$PASSING_SERVICES- Emotion Service\n"
          else
            echo "| Emotion Service | ❌ ${{ needs.test-emotion-service.result }} |" >> pr_body.txt
          fi
          
          if [ "${{ needs.test-report-service.result }}" == "success" ]; then
            echo "| Report Service | ✅ Tests Passed |" >> pr_body.txt
            PASSING_SERVICES="$PASSING_SERVICES- Report Service\n"
          else
            echo "| Report Service | ❌ ${{ needs.test-report-service.result }} |" >> pr_body.txt
          fi
          
          if [ "${{ needs.test-notification-service.result }}" == "success" ]; then
            echo "| Notification Service | ✅ Tests Passed |" >> pr_body.txt
            PASSING_SERVICES="$PASSING_SERVICES- Notification Service\n"
          else
            echo "| Notification Service | ❌ ${{ needs.test-notification-service.result }} |" >> pr_body.txt
          fi
          
          if [ "${{ needs.test-user-service.result }}" == "success" ]; then
            echo "| User Service | ✅ Tests Passed |" >> pr_body.txt
            PASSING_SERVICES="$PASSING_SERVICES- User Service\n"
          else
            echo "| User Service | ❌ ${{ needs.test-user-service.result }} |" >> pr_body.txt
          fi
          
          if [ "${{ needs.test-analytics-service.result }}" == "success" ]; then
            echo "| Analytics Service | ✅ Tests Passed |" >> pr_body.txt
            PASSING_SERVICES="$PASSING_SERVICES- Analytics Service\n"
          else
            echo "| Analytics Service | ❌ ${{ needs.test-analytics-service.result }} |" >> pr_body.txt
          fi
          
          if [ "${{ needs.test-goal-service.result }}" == "success" ]; then
            echo "| Goal Service | ✅ Tests Passed |" >> pr_body.txt
            PASSING_SERVICES="$PASSING_SERVICES- Goal Service\n"
          else
            echo "| Goal Service | ❌ ${{ needs.test-goal-service.result }} |" >> pr_body.txt
          fi
          
          if [ "${{ needs.test-journal-service.result }}" == "success" ]; then
            echo "| Journal Service | ✅ Tests Passed |" >> pr_body.txt
            PASSING_SERVICES="$PASSING_SERVICES- Journal Service\n"
          else
            echo "| Journal Service | ❌ ${{ needs.test-journal-service.result }} |" >> pr_body.txt
          fi
          
          if [ "${{ needs.test-recommendation-service.result }}" == "success" ]; then
            echo "| Recommendation Service | ✅ Tests Passed |" >> pr_body.txt
            PASSING_SERVICES="$PASSING_SERVICES- Recommendation Service\n"
          else
            echo "| Recommendation Service | ❌ ${{ needs.test-recommendation-service.result }} |" >> pr_body.txt
          fi
          
          if [ "${{ needs.test-api-gateway.result }}" == "success" ]; then
            echo "| API Gateway | ✅ Tests Passed |" >> pr_body.txt
            PASSING_SERVICES="$PASSING_SERVICES- API Gateway\n"
          else
            echo "| API Gateway | ❌ ${{ needs.test-api-gateway.result }} |" >> pr_body.txt
          fi
          
          echo "" >> pr_body.txt
          echo "## ✅ Services Ready for QA" >> pr_body.txt
          echo "" >> pr_body.txt
          echo -e "$PASSING_SERVICES" >> pr_body.txt
          echo "" >> pr_body.txt
          echo "All tests passed successfully. Ready to merge to QA branch." >> pr_body.txt
          echo "" >> pr_body.txt
          echo "🐳 **Note:** Docker images will be built automatically after PR approval and merge." >> pr_body.txt

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          # Create labels if they don't exist
          gh label create "automated-pr" --description "Automated PR from CI/CD" --color "0366d6" --force || true
          gh label create "qa-deployment" --description "QA deployment" --color "fbca04" --force || true
          
          # Check if PR already exists
          EXISTING_PR=$(gh pr list --base qa --head dev --json number --jq '.[0].number' || echo "")
          
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists, updating it..."
            gh pr edit $EXISTING_PR --body-file pr_body.txt
            gh pr edit $EXISTING_PR --add-label "automated-pr,qa-deployment" || true
            echo "✅ Updated existing PR #$EXISTING_PR"
          else
            echo "Creating new PR from dev to qa..."
            gh pr create \
              --base qa \
              --head dev \
              --title "🚀 Deploy passing services to QA" \
              --body-file pr_body.txt \
              --label "automated-pr,qa-deployment"
            echo "✅ Created new PR"
          fi

  # Summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs:
      - test-auth-service
      - test-emotion-service
      - test-report-service
      - test-notification-service
      - test-user-service
      - test-analytics-service
      - test-goal-service
      - test-journal-service
      - test-recommendation-service
      - test-api-gateway
    if: always()
    steps:
      - name: Print Summary
        run: |
          echo "## 📊 Test Results Summary"
          echo ""
          echo "| Service | Status | QA Merge |"
          echo "|---------|--------|----------|"
          echo "| Auth Service | ${{ needs.test-auth-service.result }} | ${{ needs.test-auth-service.result == 'success' && '✅ Ready for QA' || '❌ Not ready' }} |"
          echo "| Emotion Service | ${{ needs.test-emotion-service.result }} | ${{ needs.test-emotion-service.result == 'success' && '✅ Ready for QA' || '❌ Not ready' }} |"
          echo "| Report Service | ${{ needs.test-report-service.result }} | ${{ needs.test-report-service.result == 'success' && '✅ Ready for QA' || '❌ Not ready' }} |"
          echo "| Notification Service | ${{ needs.test-notification-service.result }} | ${{ needs.test-notification-service.result == 'success' && '✅ Ready for QA' || '❌ Not ready' }} |"
          echo "| User Service | ${{ needs.test-user-service.result }} | ${{ needs.test-user-service.result == 'success' && '✅ Ready for QA' || '❌ Not ready' }} |"
          echo "| Analytics Service | ${{ needs.test-analytics-service.result }} | ${{ needs.test-analytics-service.result == 'success' && '✅ Ready for QA' || '❌ Not ready' }} |"
          echo "| Goal Service | ${{ needs.test-goal-service.result }} | ${{ needs.test-goal-service.result == 'success' && '✅ Ready for QA' || '❌ Not ready' }} |"
          echo "| Journal Service | ${{ needs.test-journal-service.result }} | ${{ needs.test-journal-service.result == 'success' && '✅ Ready for QA' || '❌ Not ready' }} |"
          echo "| Recommendation Service | ${{ needs.test-recommendation-service.result }} | ${{ needs.test-recommendation-service.result == 'success' && '✅ Ready for QA' || '❌ Not ready' }} |"
          echo "| API Gateway | ${{ needs.test-api-gateway.result }} | ${{ needs.test-api-gateway.result == 'success' && '✅ Ready for QA' || '❌ Not ready' }} |"
          echo ""
          echo "✅ = Tests passed, PR to QA will be created"
          echo "❌ = Tests failed or skipped (no PR)"

      - name: Services Status
        if: always()
        run: |
          if [ "${{ needs.test-auth-service.result }}" == "failure" ] || \
             [ "${{ needs.test-emotion-service.result }}" == "failure" ] || \
             [ "${{ needs.test-report-service.result }}" == "failure" ] || \
             [ "${{ needs.test-notification-service.result }}" == "failure" ] || \
             [ "${{ needs.test-user-service.result }}" == "failure" ] || \
             [ "${{ needs.test-analytics-service.result }}" == "failure" ] || \
             [ "${{ needs.test-goal-service.result }}" == "failure" ] || \
             [ "${{ needs.test-journal-service.result }}" == "failure" ] || \
             [ "${{ needs.test-recommendation-service.result }}" == "failure" ] || \
             [ "${{ needs.test-api-gateway.result }}" == "failure" ]; then
            echo "⚠️ Some services have failing tests. PR to QA will only include passing services."
            echo "Please review the logs and fix the issues."
          else
            echo "✅ All tested services passed! PR to QA will be created."
          fi
