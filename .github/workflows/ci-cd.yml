name: CI/CD - Dev to QA

on:
  push:
    branches:
      - dev
    paths:
      - 'services/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - dev
    paths:
      - 'services/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      api-gateway: ${{ steps.changes.outputs.api-gateway }}
      auth-service: ${{ steps.changes.outputs.auth-service }}
      emotion-service: ${{ steps.changes.outputs.emotion-service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: changes
        run: |
          # Get the list of changed files
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          fi
          
          echo "Changed files: $CHANGED_FILES"
          
          # Check which services changed
          echo "api-gateway=$(echo "$CHANGED_FILES" | grep -q '^services/api-gateway/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "auth-service=$(echo "$CHANGED_FILES" | grep -q '^services/auth-service/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "emotion-service=$(echo "$CHANGED_FILES" | grep -q '^services/emotion-service/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

  # Test API Gateway
  test-api-gateway:
    name: Test API Gateway
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api-gateway == 'true' || github.event_name == 'pull_request'
    outputs:
      status: ${{ job.status }}
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'services/api-gateway/package-lock.json'

      - name: Install dependencies
        working-directory: services/api-gateway
        run: npm ci

      - name: Run linter
        working-directory: services/api-gateway
        run: npm run lint --if-present || true

      - name: Run tests
        working-directory: services/api-gateway
        run: npm test -- --coverage --passWithNoTests

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./services/api-gateway/coverage/coverage-final.json
          flags: api-gateway
          fail_ci_if_error: false

  # Test Auth Service
  test-auth-service:
    name: Test Auth Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.auth-service == 'true' || github.event_name == 'pull_request'
    outputs:
      status: ${{ job.status }}
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'services/auth-service/package-lock.json'

      - name: Install dependencies
        working-directory: services/auth-service
        run: npm ci

      - name: Run linter
        working-directory: services/auth-service
        run: npm run lint --if-present || true

      - name: Run tests
        working-directory: services/auth-service
        run: npm test -- --coverage --passWithNoTests

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./services/auth-service/coverage/coverage-final.json
          flags: auth-service
          fail_ci_if_error: false

  # Test Emotion Service
  test-emotion-service:
    name: Test Emotion Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.emotion-service == 'true' || github.event_name == 'pull_request'
    outputs:
      status: ${{ job.status }}
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'services/emotion-service/package-lock.json'

      - name: Install dependencies
        working-directory: services/emotion-service
        run: npm ci

      - name: Run linter
        working-directory: services/emotion-service
        run: npm run lint --if-present || true

      - name: Run tests
        working-directory: services/emotion-service
        run: npm test -- --coverage --passWithNoTests

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./services/emotion-service/coverage/coverage-final.json
          flags: emotion-service
          fail_ci_if_error: false

  # Create Pull Request to QA branch for passing services
  create-pr-to-qa:
    name: Create PR to QA
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - test-api-gateway
      - test-auth-service
      - test-emotion-service
    if: |
      always() &&
      github.event_name == 'push' && 
      github.ref == 'refs/heads/dev' &&
      (needs.test-api-gateway.result == 'success' || 
       needs.test-auth-service.result == 'success' || 
       needs.test-emotion-service.result == 'success')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build PR Summary
        id: pr-summary
        run: |
          echo "## 📊 Test Results" > pr_body.txt
          echo "" >> pr_body.txt
          echo "| Service | Status |" >> pr_body.txt
          echo "|---------|--------|" >> pr_body.txt
          
          PASSING_SERVICES=""
          
          if [ "${{ needs.test-api-gateway.result }}" == "success" ]; then
            echo "| API Gateway | ✅ Tests Passed |" >> pr_body.txt
            PASSING_SERVICES="$PASSING_SERVICES- API Gateway\n"
          else
            echo "| API Gateway | ❌ ${{ needs.test-api-gateway.result }} |" >> pr_body.txt
          fi
          
          if [ "${{ needs.test-auth-service.result }}" == "success" ]; then
            echo "| Auth Service | ✅ Tests Passed |" >> pr_body.txt
            PASSING_SERVICES="$PASSING_SERVICES- Auth Service\n"
          else
            echo "| Auth Service | ❌ ${{ needs.test-auth-service.result }} |" >> pr_body.txt
          fi
          
          if [ "${{ needs.test-emotion-service.result }}" == "success" ]; then
            echo "| Emotion Service | ✅ Tests Passed |" >> pr_body.txt
            PASSING_SERVICES="$PASSING_SERVICES- Emotion Service\n"
          else
            echo "| Emotion Service | ❌ ${{ needs.test-emotion-service.result }} |" >> pr_body.txt
          fi
          
          echo "" >> pr_body.txt
          echo "## ✅ Services Ready for QA" >> pr_body.txt
          echo "" >> pr_body.txt
          echo -e "$PASSING_SERVICES" >> pr_body.txt
          echo "" >> pr_body.txt
          echo "All tests passed successfully. Ready to merge to QA branch." >> pr_body.txt
          echo "" >> pr_body.txt
          echo "🐳 **Note:** Docker images will be built automatically after PR approval and merge." >> pr_body.txt

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          # Check if PR already exists
          EXISTING_PR=$(gh pr list --base qa --head dev --json number --jq '.[0].number' || echo "")
          
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists, updating it..."
            gh pr edit $EXISTING_PR --body-file pr_body.txt
            echo "✅ Updated existing PR #$EXISTING_PR"
          else
            echo "Creating new PR from dev to qa..."
            gh pr create \
              --base qa \
              --head dev \
              --title "🚀 Deploy passing services to QA" \
              --body-file pr_body.txt \
              --label "automated-pr,qa-deployment"
            echo "✅ Created new PR"
          fi

  # Summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs:
      - test-api-gateway
      - test-auth-service
      - test-emotion-service
    if: always()
    steps:
      - name: Print Summary
        run: |
          echo "## 📊 Test Results Summary"
          echo ""
          echo "| Service | Status | QA Merge |"
          echo "|---------|--------|----------|"
          echo "| API Gateway | ${{ needs.test-api-gateway.result }} | ${{ needs.test-api-gateway.result == 'success' && '✅ Ready for QA' || '❌ Not ready' }} |"
          echo "| Auth Service | ${{ needs.test-auth-service.result }} | ${{ needs.test-auth-service.result == 'success' && '✅ Ready for QA' || '❌ Not ready' }} |"
          echo "| Emotion Service | ${{ needs.test-emotion-service.result }} | ${{ needs.test-emotion-service.result == 'success' && '✅ Ready for QA' || '❌ Not ready' }} |"
          echo ""
          echo "✅ = Tests passed, PR to QA will be created"
          echo "❌ = Tests failed or skipped (no PR)"

      - name: Services Status
        if: always()
        run: |
          if [ "${{ needs.test-api-gateway.result }}" == "failure" ] || [ "${{ needs.test-auth-service.result }}" == "failure" ] || [ "${{ needs.test-emotion-service.result }}" == "failure" ]; then
            echo "⚠️ Some services have failing tests. PR to QA will only include passing services."
            echo "Please review the logs and fix the issues."
          else
            echo "✅ All tested services passed! PR to QA will be created."
          fi
