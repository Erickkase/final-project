name: CI/CD - Dev to QA

on:
  push:
    branches:
      - dev
    paths:
      - 'services/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - dev
    paths:
      - 'services/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      api-gateway: ${{ steps.changes.outputs.api-gateway }}
      auth-service: ${{ steps.changes.outputs.auth-service }}
      emotion-service: ${{ steps.changes.outputs.emotion-service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: changes
        run: |
          # Get the list of changed files
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          fi
          
          echo "Changed files: $CHANGED_FILES"
          
          # Check which services changed
          echo "api-gateway=$(echo "$CHANGED_FILES" | grep -q '^services/api-gateway/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "auth-service=$(echo "$CHANGED_FILES" | grep -q '^services/auth-service/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "emotion-service=$(echo "$CHANGED_FILES" | grep -q '^services/emotion-service/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

  # Test API Gateway
  test-api-gateway:
    name: Test API Gateway
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api-gateway == 'true' || github.event_name == 'pull_request'
    outputs:
      status: ${{ job.status }}
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'services/api-gateway/package-lock.json'

      - name: Install dependencies
        working-directory: services/api-gateway
        run: npm ci

      - name: Run linter
        working-directory: services/api-gateway
        run: npm run lint --if-present || true

      - name: Run tests
        working-directory: services/api-gateway
        run: npm test -- --coverage --passWithNoTests

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./services/api-gateway/coverage/coverage-final.json
          flags: api-gateway
          fail_ci_if_error: false

  # Test Auth Service
  test-auth-service:
    name: Test Auth Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.auth-service == 'true' || github.event_name == 'pull_request'
    outputs:
      status: ${{ job.status }}
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'services/auth-service/package-lock.json'

      - name: Install dependencies
        working-directory: services/auth-service
        run: npm ci

      - name: Run linter
        working-directory: services/auth-service
        run: npm run lint --if-present || true

      - name: Run tests
        working-directory: services/auth-service
        run: npm test -- --coverage --passWithNoTests

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./services/auth-service/coverage/coverage-final.json
          flags: auth-service
          fail_ci_if_error: false

  # Test Emotion Service
  test-emotion-service:
    name: Test Emotion Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.emotion-service == 'true' || github.event_name == 'pull_request'
    outputs:
      status: ${{ job.status }}
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'services/emotion-service/package-lock.json'

      - name: Install dependencies
        working-directory: services/emotion-service
        run: npm ci

      - name: Run linter
        working-directory: services/emotion-service
        run: npm run lint --if-present || true

      - name: Run tests
        working-directory: services/emotion-service
        run: npm test -- --coverage --passWithNoTests

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./services/emotion-service/coverage/coverage-final.json
          flags: emotion-service
          fail_ci_if_error: false

  # Merge to QA branch - selective by service
  merge-to-qa:
    name: Merge Passing Services to QA
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - test-api-gateway
      - test-auth-service
      - test-emotion-service
    if: |
      always() &&
      github.event_name == 'push' && 
      github.ref == 'refs/heads/dev' &&
      (needs.test-api-gateway.result == 'success' || 
       needs.test-auth-service.result == 'success' || 
       needs.test-emotion-service.result == 'success')
    outputs:
      merged-services: ${{ steps.merge-summary.outputs.services }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --local user.email "ehbonilla@uce.edu.ec"
          git config --local user.name "Erickkase"
          git config --local url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Fetch QA branch
        run: git fetch origin qa 2>/dev/null || git branch qa origin/dev

      - name: Merge API Gateway if passed
        if: needs.test-api-gateway.result == 'success'
        run: |
          git checkout qa
          git merge origin/dev -m "Merge api-gateway from dev to qa (tests passed) [CI/CD]" --no-ff --strategy-option=theirs || echo "Already up to date or conflict"
          # Check if there are changes to commit
          if git diff-index --quiet HEAD --; then
            echo "No new changes for api-gateway"
          fi
          git push origin qa || echo "Push skipped"
          git checkout dev

      - name: Merge Auth Service if passed
        if: needs.test-auth-service.result == 'success'
        run: |
          git checkout qa
          git merge origin/dev -m "Merge auth-service from dev to qa (tests passed) [CI/CD]" --no-ff --strategy-option=theirs || echo "Already up to date or conflict"
          if git diff-index --quiet HEAD --; then
            echo "No new changes for auth-service"
          fi
          git push origin qa || echo "Push skipped"
          git checkout dev

      - name: Merge Emotion Service if passed
        if: needs.test-emotion-service.result == 'success'
        run: |
          git checkout qa
          git merge origin/dev -m "Merge emotion-service from dev to qa (tests passed) [CI/CD]" --no-ff --strategy-option=theirs || echo "Already up to date or conflict"
          if git diff-index --quiet HEAD --; then
            echo "No new changes for emotion-service"
          fi
          git push origin qa || echo "Push skipped"
          git checkout dev

      - name: Summary
        id: merge-summary
        run: |
          echo "## QA Merge Summary"
          MERGED=""
          
          if [ "${{ needs.test-api-gateway.result }}" == "success" ]; then
            echo "✅ API Gateway: Merged"
            MERGED="$MERGED api-gateway"
          else
            echo "❌ API Gateway: Not merged (status: ${{ needs.test-api-gateway.result }})"
          fi
          
          if [ "${{ needs.test-auth-service.result }}" == "success" ]; then
            echo "✅ Auth Service: Merged"
            MERGED="$MERGED auth-service"
          else
            echo "❌ Auth Service: Not merged (status: ${{ needs.test-auth-service.result }})"
          fi
          
          if [ "${{ needs.test-emotion-service.result }}" == "success" ]; then
            echo "✅ Emotion Service: Merged"
            MERGED="$MERGED emotion-service"
          else
            echo "❌ Emotion Service: Not merged (status: ${{ needs.test-emotion-service.result }})"
          fi
          
          echo "services=$MERGED" >> $GITHUB_OUTPUT
          echo ""
          echo "🐳 Docker Build will trigger automatically for merged services"

  # Summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs:
      - test-api-gateway
      - test-auth-service
      - test-emotion-service
    if: always()
    steps:
      - name: Print Summary
        run: |
          echo "## 📊 Test Results Summary"
          echo ""
          echo "| Service | Status | QA Merge |"
          echo "|---------|--------|----------|"
          echo "| API Gateway | ${{ needs.test-api-gateway.result }} | ${{ needs.test-api-gateway.result == 'success' && '✅ Merged' || '❌ Not merged' }} |"
          echo "| Auth Service | ${{ needs.test-auth-service.result }} | ${{ needs.test-auth-service.result == 'success' && '✅ Merged' || '❌ Not merged' }} |"
          echo "| Emotion Service | ${{ needs.test-emotion-service.result }} | ${{ needs.test-emotion-service.result == 'success' && '✅ Merged' || '❌ Not merged' }} |"
          echo ""
          echo "✅ = Tests passed and merged to QA"
          echo "❌ = Tests failed or skipped (not merged)"

      - name: Services Status
        if: always()
        run: |
          if [ "${{ needs.test-api-gateway.result }}" == "failure" ] || [ "${{ needs.test-auth-service.result }}" == "failure" ] || [ "${{ needs.test-emotion-service.result }}" == "failure" ]; then
            echo "⚠️ Some services have failing tests and will NOT be merged to QA."
            echo "Please review the logs and fix the issues."
          else
            echo "✅ All tested services passed!"
          fi
