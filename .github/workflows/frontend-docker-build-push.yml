name: Frontend Docker Build and Deploy

on:
  pull_request:
    types:
      - closed
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/frontend-docker-build-push.yml'
    branches:
      - qa
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: 'Environment to deploy to'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - production

jobs:
  build-and-push:
    name: Build & Push Frontend Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'qa' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-frontend
          tags: |
            type=raw,value=latest
            type=raw,value=v1.${{ github.run_number }}
            type=sha,prefix={{branch}}-

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
          build-args: |
            VITE_API_BASE_URL=${{ secrets.FRONTEND_API_URL }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Image digest
        run: echo "Image pushed with tags:${{ steps.meta.outputs.tags }}"

  deploy-to-aws:
    name: Deploy Frontend to AWS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/qa' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'qa' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate
        
      - name: Check Existing Resources
        id: check-resources
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          echo "Checking for existing resources in AWS..."
          
          # Check if resources already exist
          EXISTING_RESOURCES=0
          
          # Check microservices ALB
          if aws elbv2 describe-load-balancers --names emotrack-alb 2>/dev/null | grep -q "emotrack-alb"; then
            echo "Found existing emotrack-alb"
            EXISTING_RESOURCES=$((EXISTING_RESOURCES + 1))
          fi
          
          # Check frontend ALB
          if aws elbv2 describe-load-balancers --names emotrack-frontend-alb 2>/dev/null | grep -q "emotrack-frontend-alb"; then
            echo "Found existing emotrack-frontend-alb"
            EXISTING_RESOURCES=$((EXISTING_RESOURCES + 1))
          fi
          
          echo "existing_count=$EXISTING_RESOURCES" >> $GITHUB_OUTPUT
          
          if [ $EXISTING_RESOURCES -gt 0 ]; then
            echo "⚠️ Found $EXISTING_RESOURCES existing resources, will handle carefully"
          else
            echo "✅ No existing resources found, clean deployment"
          fi

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="AWS_REGION=${{ secrets.AWS_REGION }}" \
            -var="AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" \
            -var="AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            -var="AWS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }}" \
            -var="docker_hub_username=${{ secrets.DOCKER_HUB_USERNAME }}" \
            -var="image_tag=v1.${{ github.run_number }}" \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
            -var="vpc_id=${{ secrets.VPC_ID }}" \
            -var="subnet1=${{ secrets.SUBNET1 }}" \
            -var="subnet2=${{ secrets.SUBNET2 }}" \
            -var="BRANCH_NAME=qa" \
            -out=tfplan

      - name: Terraform Apply
        id: terraform-apply
        run: |
          # Apply with automatic handling of existing resources
          if terraform apply -auto-approve tfplan 2>&1 | tee apply.log; then
            echo "result=success" >> $GITHUB_OUTPUT
            echo "✅ Terraform apply completed successfully"
          else
            # Check if error is just about existing resources
            if grep -q "already exists" apply.log; then
              echo "result=exists" >> $GITHUB_OUTPUT
              echo "⚠️ Some resources already exist, this is expected"
              echo "📝 Terraform will manage existing resources on next run"
              exit 0
            else
              echo "result=failed" >> $GITHUB_OUTPUT
              echo "❌ Terraform apply failed with unexpected error"
              cat apply.log
              exit 1
            fi
          fi

      - name: Get Frontend ALB DNS
        id: alb-dns
        continue-on-error: true
        run: |
          FRONTEND_ALB_DNS=$(terraform output -raw frontend_alb_dns 2>/dev/null || echo "not-deployed-yet")
          echo "frontend_alb_dns=$FRONTEND_ALB_DNS" >> $GITHUB_OUTPUT
          echo "🌐 Frontend ALB DNS: $FRONTEND_ALB_DNS"

      - name: Get Frontend ASG Name
        id: asg-name
        continue-on-error: true
        run: |
          FRONTEND_ASG_NAME=$(terraform output -raw frontend_asg_name 2>/dev/null || echo "emotrack-frontend-asg")
          echo "frontend_asg_name=$FRONTEND_ASG_NAME" >> $GITHUB_OUTPUT
          echo "📦 Frontend ASG Name: $FRONTEND_ASG_NAME"
          
      - name: Get Backend API URL
        id: backend-url
        run: |
          # Use the FRONTEND_API_URL secret (already configured)
          # This is the backend ALB DNS that frontend will call
          BACKEND_URL="${{ secrets.FRONTEND_API_URL }}"
          
          if [ -z "$BACKEND_URL" ] || [ "$BACKEND_URL" == "null" ]; then
            # Fallback: try to get from Terraform if available
            BACKEND_URL=$(terraform output -raw api_gateway_url 2>/dev/null || echo "")
            
            if [ -z "$BACKEND_URL" ]; then
              # Second fallback: try emotrack_alb_dns
              BACKEND_ALB=$(terraform output -raw emotrack_alb_dns 2>/dev/null || echo "")
              if [ -n "$BACKEND_ALB" ]; then
                BACKEND_URL="http://$BACKEND_ALB"
              else
                echo "❌ ERROR: FRONTEND_API_URL secret not configured and backend not found in Terraform state"
                echo "Please configure the FRONTEND_API_URL secret with your backend ALB DNS"
                echo "Example: gh secret set FRONTEND_API_URL --body 'http://your-backend-alb-dns'"
                exit 1
              fi
            fi
          fi
          
          echo "backend_url=$BACKEND_URL" >> $GITHUB_OUTPUT
          echo "🔗 Backend API URL: $BACKEND_URL"
          echo "✅ Frontend will connect to backend at: $BACKEND_URL"

  refresh-instances:
    name: Refresh ASG Instances
    runs-on: ubuntu-latest
    needs: deploy-to-aws
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get Frontend ASG Name from Terraform
        id: get-asg
        working-directory: infra
        run: |
          terraform init
          FRONTEND_ASG_NAME=$(terraform output -raw frontend_asg_name)
          echo "frontend_asg_name=$FRONTEND_ASG_NAME" >> $GITHUB_OUTPUT
          echo "Frontend ASG Name: $FRONTEND_ASG_NAME"

      - name: Start Instance Refresh
        run: |
          echo "Starting instance refresh for Frontend ASG: ${{ steps.get-asg.outputs.frontend_asg_name }}"
          
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ steps.get-asg.outputs.frontend_asg_name }} \
            --preferences '{
              "MinHealthyPercentage": 50,
              "InstanceWarmup": 300,
              "CheckpointPercentages": [50, 100],
              "CheckpointDelay": 300
            }' \
            --query 'InstanceRefreshId' \
            --output text)
          
          echo "Instance refresh started with ID: $REFRESH_ID"
          echo "refresh_id=$REFRESH_ID" >> $GITHUB_OUTPUT

      - name: Wait for Instance Refresh
        run: |
          echo "Waiting for instance refresh to complete..."
          
          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name ${{ steps.get-asg.outputs.frontend_asg_name }} \
              --query 'InstanceRefreshes[0].Status' \
              --output text)
            
            echo "Current status: $STATUS"
            
            if [ "$STATUS" = "Successful" ]; then
              echo "✅ Instance refresh completed successfully!"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "❌ Instance refresh failed with status: $STATUS"
              exit 1
            fi
            
            sleep 30
          done

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-to-aws, refresh-instances]
    if: always()
    steps:
      - name: Print Deployment Summary
        run: |
          echo "## 🚀 Frontend Deployment Summary"
          echo ""
          echo "| Stage | Status |"
          echo "|-------|--------|"
          echo "| Build & Push | ${{ needs.build-and-push.result }} |"
          echo "| Deploy to AWS | ${{ needs.deploy-to-aws.result }} |"
          echo "| Refresh Instances | ${{ needs.refresh-instances.result }} |"
          echo ""
          echo "### 📦 Docker Image"
          echo "- Repository: ${{ secrets.DOCKER_HUB_USERNAME }}/emotrack-frontend"
          echo "- Tag: v1.${{ github.run_number }}"
          echo ""
          echo "### 🔗 Configuration"
          echo "- API Base URL: ${{ secrets.FRONTEND_API_URL }}"
          echo ""
          echo "### 🌐 Access"
          echo "Frontend will be available at your ALB DNS after deployment completes"
          echo ""

      - name: Check for failures
        if: |
          needs.build-and-push.result == 'failure' ||
          needs.deploy-to-aws.result == 'failure' ||
          needs.refresh-instances.result == 'failure'
        run: |
          echo "❌ Frontend deployment failed. Please check the logs."
          exit 1

      - name: Success
        if: |
          needs.build-and-push.result == 'success' &&
          needs.deploy-to-aws.result == 'success' &&
          needs.refresh-instances.result == 'success'
        run: |
          echo "✅ Frontend deployed successfully to AWS!"
          echo "🎉 New instances are running with the latest frontend code"
